<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Python Form Designer">
  <defs>
    <linearGradient id="pfdBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b8bbe"/>
      <stop offset="1" stop-color="#306998"/>
    </linearGradient>
    <linearGradient id="pfdYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe873"/>
      <stop offset="1" stop-color="#ffd43b"/>
    </linearGradient>
  </defs>

  <!-- the form window -->
  <rect x="2.5" y="4.5" width="59" height="55" rx="8" fill="#ffffff" stroke="#306998" stroke-width="3"/>
  <path d="M2.5 16.5h59" stroke="#306998" stroke-width="3" stroke-linecap="round"/>
  <circle cx="10" cy="10.5" r="2.1" fill="#306998"/>
  <circle cx="17.5" cy="10.5" r="2.1" fill="#4b8bbe"/>
  <circle cx="25" cy="10.5" r="2.1" fill="#ffd43b"/>

  <!-- the python snake inside the form -->
  <path d="M40 27H29a6 6 0 0 0-6 6v7a6 6 0 0 0 6 6h7a6 6 0 0 1 6 6v1"
        fill="none" stroke="url(#pfdBlue)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 53h7" fill="none" stroke="url(#pfdYellow)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="41" cy="27" r="4.6" fill="#306998"/>
  <circle cx="42.6" cy="25.6" r="1.3" fill="#ffffff"/>
</svg>
